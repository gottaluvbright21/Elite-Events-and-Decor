<main id="main" class="page narrow"><p class="eyebrow">START PLANNING</p><h1>Make an enquiry</h1><p class="lead">Tell us a little about your event and we will prepare an enquiry summary.</p><form class="form" id="enquiry-form" novalidate><label for="enq-name">Full name *</label><input id="enq-name" name="name" required minlength="2"><label for="enq-email">Email address *</label><input id="enq-email" name="email" type="email" required><label for="event-type">Event type *</label><select id="event-type" name="eventType" required><option value="">Choose an event</option><option>Wedding</option><option>Birthday</option><option>Corporate event</option><option>Other</option></select><label for="event-date">Preferred date</label><input id="event-date" name="date" type="date"><label for="guests">Estimated number of guests</label><input id="guests" name="guests" type="number" min="1" max="2000"><label for="enq-message">Tell us about your plans *</label><textarea id="enq-message" name="message" rows="5" required minlength="10"></textarea><button class="button" type="submit">Submit enquiry</button><p class="form-status" id="enquiry-status" role="status"></p></form></main>
